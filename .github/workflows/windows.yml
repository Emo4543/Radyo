name: Build Zenith Radyo Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter projesi olustur
        shell: bash
        run: |
          flutter create --org com.zenith --project-name zenith_radyo --platforms=windows winapp
          rm -rf winapp/test
          cp app_pubspec.yaml winapp/pubspec.yaml
          cp *.dart winapp/lib/

      - name: Windows derle
        working-directory: winapp
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          SUPABASE_URL: "https://ictoizlfrkewcgrqgydi.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_o2mtSdF5IYQwAIIy_lc-NA_f_EYgu91"
        run: |
          flutter pub get
          flutter build windows --release

      - name: Zip hazirla
        shell: pwsh
        run: Compress-Archive -Path winapp/build/windows/x64/runner/Release/* -DestinationPath ZenithRadyoPC.zip

      - name: Release yayinla
        uses: ncipollo/release-action@v1
        with:
          tag: radyo-pc
          name: Zenith Radyo PC
          artifacts: ZenithRadyoPC.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
